<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Games Zone — Igidigbo Kids World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#6EC6FF; --sky-bottom:#CDEEFF; --grass:#7BD389; --grass-dark:#5FB86A;
    --ink:#2B2350; --ink-soft:#655D8A; --card-white:#FFFFFF;
    --amber:#FFC94A; --amber-dark:#FF9F45; --coral:#FF7AB6; --coral-dark:#FF5C8D;
    --teal:#3FBFB0; --teal-dark:#2E9E91; --grape:#A66BD1; --grape-dark:#7A4FB5;
    --leaf:#5FB86A; --leaf-dark:#3F8F52; --tomato:#FF7A6E; --tomato-dark:#E4503F;
    --sun:#FFD166; --sky:#4FA8FF; --skyd:#3457C7; --shadow-ink:43,35,80;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100%; font-family:'Nunito',sans-serif; color:var(--ink);
    background:
      radial-gradient(120px 120px at 88% 6%, rgba(255,209,102,0.9), rgba(255,209,102,0) 70%),
      linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 62%, var(--grass) 62%, var(--grass-dark) 100%);
    background-attachment:fixed; overflow-x:hidden;
  }
  button{ font-family:inherit; }
  .hidden{ display:none !important; }

  .scenery{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .hill{ position:absolute; bottom:-6%; width:60%; height:22%; border-radius:50%; opacity:0.55; }
  .hill.h1{ left:-10%; background:var(--grass-dark); }
  .hill.h2{ right:-15%; width:70%; height:26%; background:#4FA85E; opacity:0.4; }
  .cloud{ position:absolute; background:#fff; opacity:0.85; border-radius:50px; }
  .cloud::before,.cloud::after{ content:''; position:absolute; background:inherit; border-radius:50%; }
  .cloud.c1{ width:70px; height:26px; top:8%; left:8%; }
  .cloud.c1::before{ width:40px; height:40px; top:-18px; left:8px; }
  .cloud.c1::after{ width:30px; height:30px; top:-12px; left:34px; }
  .cloud.c2{ width:56px; height:20px; top:16%; left:70%; }
  .cloud.c2::before{ width:32px; height:32px; top:-14px; left:6px; }
  .cloud.c2::after{ width:24px; height:24px; top:-9px; left:26px; }

  #app{ position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; gap:10px; }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    border:none; background:rgba(255,255,255,0.85); color:var(--ink); width:44px; height:44px; border-radius:16px;
    font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 0 rgba(var(--shadow-ink),0.12);
  }
  .icon-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(var(--shadow-ink),0.12); }
  .back-btn{
    display:flex; align-items:center; gap:6px; border:none; cursor:pointer; background:rgba(255,255,255,0.85);
    color:var(--ink); font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px;
    padding:10px 16px 10px 12px; border-radius:16px; box-shadow:0 4px 0 rgba(var(--shadow-ink),0.12);
  }
  .back-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(var(--shadow-ink),0.12); }
  .star-pill{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.85); padding:9px 14px; border-radius:16px;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; box-shadow:0 4px 0 rgba(var(--shadow-ink),0.12);
  }

  main{ flex:1; display:flex; flex-direction:column; padding:0 18px 20px; }

  .hero{ text-align:center; padding:18px 8px 6px; }
  .hero h1{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:42px; margin:0; color:var(--ink); }
  .hero p{ margin:8px auto 0; max-width:460px; color:var(--ink-soft); font-size:15.5px; font-weight:600; }

  /* category picker */
  .category-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:22px; max-width:820px; margin:26px auto 0; width:100%; }
  @media (max-width:640px){ .category-grid{ grid-template-columns:1fr; max-width:380px; } }
  .category-card{
    border:none; cursor:pointer; text-align:left; padding:0; border-radius:28px; overflow:hidden; background:#fff;
    box-shadow:0 14px 0 -6px rgba(var(--shadow-ink),0.12), 0 14px 24px -10px rgba(var(--shadow-ink),0.35);
    display:flex; flex-direction:column; transition:transform 160ms ease;
  }
  .category-card:hover{ transform:translateY(-4px); }
  .category-card:active{ transform:translateY(1px); }
  .category-card:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .category-top{ height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .category-top .emoji{ font-size:54px; filter:drop-shadow(0 3px 2px rgba(0,0,0,0.18)); }
  .category-top .age{ font-family:'Fredoka',sans-serif; font-weight:700; color:#fff; font-size:14px; background:rgba(0,0,0,0.2); padding:4px 14px; border-radius:20px; }
  .category-body{ padding:16px 18px 20px; }
  .category-body h3{ margin:0 0 6px; font-family:'Fredoka',sans-serif; font-size:21px; }
  .category-body p{ margin:0 0 8px; color:var(--ink-soft); font-weight:600; font-size:13.5px; line-height:1.4; }
  .category-body .count{ font-size:13px; font-weight:800; color:var(--ink); opacity:0.7; }
  .theme-explorer{ background:linear-gradient(135deg, var(--sun), var(--amber-dark)); }
  .theme-challenge{ background:linear-gradient(135deg, var(--sky), var(--skyd)); }
  .scores-link{ display:block; margin:20px auto 0; background:none; border:none; cursor:pointer; font-family:'Fredoka',sans-serif; font-weight:600; color:var(--ink); font-size:15px; text-decoration:underline; }

  /* game grid (used inside a category) */
  .game-grid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; max-width:920px; margin:22px auto 0; width:100%; }
  @media (max-width:820px){ .game-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:520px){ .game-grid{ grid-template-columns:1fr; max-width:360px; } }

  .game-card{
    border:none; cursor:pointer; text-align:left; padding:0; border-radius:24px; overflow:hidden; background:var(--card-white);
    display:flex; flex-direction:column; box-shadow:0 12px 0 -6px rgba(var(--shadow-ink),0.12), 0 12px 22px -10px rgba(var(--shadow-ink),0.35);
    transition:transform 160ms ease;
  }
  .game-card:hover{ transform:translateY(-4px) rotate(-0.4deg); }
  .game-card:active{ transform:translateY(1px); }
  .game-card:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .card-top{ height:92px; display:flex; align-items:center; justify-content:center; font-size:40px; }
  .card-top span{ filter:drop-shadow(0 3px 2px rgba(0,0,0,0.15)); }
  .card-body{ padding:12px 14px 16px; }
  .card-body h3{ margin:0 0 4px; font-family:'Fredoka',sans-serif; font-size:15.5px; font-weight:600; }
  .card-body p{ margin:0 0 8px; color:var(--ink-soft); font-size:12.5px; font-weight:600; line-height:1.35; }
  .card-cta{ font-size:12px; font-weight:800; color:var(--ink); opacity:0.7; }

  .theme-abc{ background:linear-gradient(135deg, var(--amber), var(--amber-dark)); }
  .theme-count{ background:linear-gradient(135deg, var(--coral), var(--coral-dark)); }
  .theme-shape{ background:linear-gradient(135deg, var(--teal), var(--teal-dark)); }
  .theme-color{ background:conic-gradient(from 180deg, #FF5C5C, #FFD166, #63C77A, #4FA8FF, #A66BD1, #FF5C5C); }
  .theme-memory{ background:linear-gradient(135deg, var(--leaf), var(--leaf-dark)); }
  .theme-math{ background:linear-gradient(135deg, var(--tomato), var(--tomato-dark)); }

  /* game screen */
  .game-panel{
    max-width:640px; width:100%; margin:6px auto 0; background:rgba(255,255,255,0.9); border-radius:28px;
    padding:20px 20px 26px; position:relative; box-shadow:0 16px 30px -14px rgba(var(--shadow-ink),0.4);
    min-height:440px; display:flex; flex-direction:column;
  }
  .game-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .game-title-row h2{ font-family:'Fredoka',sans-serif; font-size:21px; margin:0; }
  .round-info{ font-size:13px; font-weight:700; color:var(--ink-soft); }

  .progress-row{ display:flex; gap:6px; margin:10px 0 16px; flex-wrap:wrap; }
  .pip{ width:24px; height:24px; border-radius:50%; background:#EDE9F7; display:flex; align-items:center; justify-content:center;
    font-size:12px; flex:0 0 auto; transition:background 200ms ease, transform 200ms ease; }
  .pip.done{ background:var(--sun); transform:scale(1.08); }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:6px 0 10px; }
  .prompt{ font-family:'Fredoka',sans-serif; font-size:18px; text-align:center; max-width:440px; line-height:1.35; }

  .options-row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:500px; }

  .option-btn{
    min-width:78px; min-height:78px; padding:8px; border-radius:18px; border:3px solid #EDE9F7; background:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif;
    font-weight:600; transition:border-color 150ms ease, transform 120ms ease;
  }
  .option-btn:hover{ border-color:var(--teal); }
  .option-btn:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  .option-btn.is-correct{ animation:pop-correct 550ms ease; border-color:var(--leaf-dark); background:#EAFBEC; }
  .option-btn.is-wrong{ animation:shake-wrong 420ms ease; }
  @keyframes pop-correct{ 0%{transform:scale(1);} 40%{transform:scale(1.14);} 100%{transform:scale(1);} }
  @keyframes shake-wrong{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-7px);} 75%{transform:translateX(7px);} }

  .text-opt{ min-width:110px; max-width:220px; padding:14px 16px; font-size:15px; line-height:1.3; text-align:center; white-space:normal; }

  .typing-target{ font-family:'Fredoka',sans-serif; font-size:26px; letter-spacing:1px; text-align:center; max-width:480px; }
  .tchar{ transition:color 100ms ease, background 100ms ease; }
  .tchar.pending{ color:var(--ink-soft); }
  .tchar.correct{ color:var(--leaf-dark); }
  .tchar.wrong{ color:#fff; background:var(--tomato); border-radius:4px; }
  .typing-input{
    width:100%; max-width:340px; padding:12px 18px; border-radius:14px; border:3px solid #EDE9F7;
    font-family:'Fredoka',sans-serif; font-size:18px; text-align:center; color:var(--ink);
  }
  .typing-input:focus{ outline:none; border-color:var(--teal); }
  .typing-input.is-wrong{ animation:shake-wrong 420ms ease; border-color:var(--tomato); }

  .speed-timer{
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:28px; color:var(--ink);
    background:#EDE9F7; border-radius:16px; padding:8px 20px; margin-bottom:6px;
  }
  .speed-timer.urgent{ background:#FFE1DD; color:var(--tomato-dark); animation:pip-urgent 900ms ease-in-out infinite; }
  @keyframes pip-urgent{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }

  .big-letter{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:92px; color:var(--ink); background:#fff;
    border:4px solid var(--amber); border-radius:26px; width:140px; height:140px; display:flex; align-items:center; justify-content:center; }
  .letter-opt{ font-size:38px; width:84px; height:84px; }

  .emoji-cluster{ display:flex; flex-wrap:wrap; gap:6px; max-width:260px; justify-content:center; font-size:34px; }
  .num-opt{ font-size:30px; width:74px; height:74px; }

  .shape-target-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .shape-box{ width:96px; height:96px; }
  .shape-opt .shape-box{ width:56px; height:56px; }
  .shape-opt{ width:88px; height:88px; }

  .color-word{ font-family:'Fredoka',sans-serif; font-size:34px; font-weight:600; color:var(--ink); }
  .swatch{ width:100%; height:100%; border-radius:14px; }
  .swatch-opt{ width:90px; height:90px; }
  .swatch-target{ width:110px; height:110px; border-radius:22px; box-shadow:0 6px 0 -2px rgba(var(--shadow-ink),0.15); }

  .math-row{ display:flex; align-items:center; gap:10px; font-size:26px; font-family:'Fredoka',sans-serif; flex-wrap:wrap; justify-content:center; }
  .math-fruits{ display:flex; gap:2px; font-size:24px; }
  .math-op{ font-size:30px; font-weight:700; color:var(--grape-dark); }

  .memory-grid{ display:grid; grid-template-columns:repeat(4, 66px); gap:10px; justify-content:center; }
  @media (max-width:420px){ .memory-grid{ grid-template-columns:repeat(3, 62px); } }
  .memory-card{ width:66px; height:66px; border-radius:14px; cursor:pointer; position:relative; background:var(--teal); border:none; perspective:600px; }
  @media (max-width:420px){ .memory-card{ width:62px; height:62px; } }
  .memory-card .inner{ position:relative; width:100%; height:100%; transition:transform 320ms; transform-style:preserve-3d; }
  .memory-card.flipped .inner{ transform:rotateY(180deg); }
  .memory-card .face{ position:absolute; inset:0; border-radius:14px; display:flex; align-items:center; justify-content:center; backface-visibility:hidden; font-size:28px; }
  .memory-card .front{ background:linear-gradient(135deg, var(--teal), var(--teal-dark)); color:#fff; font-size:22px; }
  .memory-card .back{ background:#fff; transform:rotateY(180deg); border:3px solid #EDE9F7; }
  .memory-card.matched .back{ border-color:var(--leaf-dark); background:#EAFBEC; }
  .memory-card:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .memory-meta{ display:flex; gap:18px; font-weight:700; color:var(--ink-soft); font-size:13.5px; margin-bottom:6px; }

  .complete-overlay{
    position:absolute; inset:10px; border-radius:24px; background:rgba(255,255,255,0.97); display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; overflow:hidden;
  }
  .complete-overlay h2{ font-family:'Fredoka',sans-serif; font-size:24px; margin:0; }
  .complete-stars{ font-size:28px; letter-spacing:4px; }
  .complete-actions{ display:flex; gap:12px; margin-top:6px; flex-wrap:wrap; justify-content:center; }
  .primary-btn, .secondary-btn{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; border:none; border-radius:16px; padding:12px 20px; cursor:pointer;
  }
  .primary-btn{ background:var(--leaf-dark); color:#fff; box-shadow:0 4px 0 #2c6a3c; }
  .primary-btn:active{ transform:translateY(3px); box-shadow:none; }
  .secondary-btn{ background:#EDE9F7; color:var(--ink); box-shadow:0 4px 0 #cfc8ea; }
  .secondary-btn:active{ transform:translateY(3px); box-shadow:none; }

  .confetti-piece{ position:absolute; top:0; width:9px; height:14px; border-radius:2px; opacity:0.95; animation:confetti-fall 1500ms ease-in forwards; }
  @keyframes confetti-fall{ from{ transform:translateY(-20px) rotate(0deg); opacity:1; } to{ transform:translateY(320px) rotate(400deg); opacity:0; } }

  /* scoreboard */
  .score-section{ margin-bottom:22px; max-width:640px; width:100%; margin-left:auto; margin-right:auto; }
  .score-section h3{ font-family:'Fredoka',sans-serif; font-size:18px; margin:0 0 10px; }
  .score-list{ display:flex; flex-direction:column; gap:8px; }
  .score-row{ display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:10px 14px;
    box-shadow:0 4px 0 -1px rgba(43,35,80,0.08); }
  .score-icon{ font-size:19px; }
  .score-name{ flex:1; font-weight:700; font-size:13.5px; }
  .score-val{ font-weight:800; font-size:12.5px; color:var(--ink-soft); white-space:nowrap; }

  .mascot{ position:fixed; left:16px; bottom:16px; display:flex; align-items:flex-end; gap:8px; z-index:5; max-width:min(88vw, 360px); }
  .mascot-bee{ font-size:38px; flex:0 0 auto; }
  .mascot-bubble{ background:#fff; border-radius:16px 16px 16px 4px; padding:10px 14px; font-weight:700; font-size:13px; color:var(--ink);
    box-shadow:0 8px 18px -8px rgba(var(--shadow-ink),0.4); max-width:270px; }

  .site-footer{ text-align:center; font-size:12px; font-weight:700; color:rgba(43,35,80,0.55); padding:16px 10px 100px; }

  .site-nav{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px 0; position:relative; z-index:2; }
  .site-nav-brand{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:15px; color:#2B2350; text-decoration:none; display:flex; align-items:center; gap:6px; }
  .site-nav-links{ display:flex; align-items:center; gap:4px; }
  .site-nav-links a{ text-decoration:none; font-weight:700; font-size:12.5px; color:#5b5480; padding:7px 11px; border-radius:10px; background:rgba(255,255,255,0.6); }
  .site-nav-links a.active{ background:#fff; color:#2B2350; }
</style>
</head>
<body>

<div class="scenery">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="hill h1"></div>
  <div class="hill h2"></div>
</div>

<div id="app">
  <div class="site-nav">
    <a href="index.html" class="site-nav-brand">🏡 Igidigbo Kids World</a>
    <div class="site-nav-links">
      <a href="index.html">Home</a>
      <a href="games.html" class="active">Games</a>
      <a href="stories.html">Stories</a>
    </div>
  </div>
  <div class="topbar">
    <div class="topbar-left" id="topbar-left"></div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="star-pill"><span>⭐</span><span id="total-stars">0</span></div>
      <button class="icon-btn" id="scores-btn" aria-label="High Scores" title="High Scores">🏆</button>
      <button class="icon-btn" id="mute-btn" aria-label="Mute sound" title="Sound">🔊</button>
    </div>
  </div>

  <main id="home-screen">
    <div class="hero">
      <h1>Sunny Meadow</h1>
      <p>Two worlds of learning games &mdash; pick your adventure!</p>
    </div>
    <div class="category-grid" id="category-grid-home"></div>
    <button class="scores-link" id="home-scores-link">🏆 View High Scores</button>
  </main>

  <main id="category-screen" class="hidden">
    <div class="hero" style="padding-top:8px;">
      <h1 id="category-heading" style="font-size:30px;">Category</h1>
      <p id="category-sub"></p>
    </div>
    <div class="game-grid" id="category-grid"></div>
  </main>

  <main id="game-screen" class="hidden">
    <div class="game-panel" id="game-panel">
      <div class="game-title-row">
        <h2 id="game-title">Game</h2>
        <div class="round-info" id="round-info"></div>
      </div>
      <div class="progress-row" id="progress-row"></div>
      <div class="stage" id="stage"></div>
    </div>
  </main>

  <main id="scores-screen" class="hidden">
    <div class="hero" style="padding-top:8px;">
      <h1 style="font-size:30px;">🏆 High Scores</h1>
      <p>Your best stars out of 8 for every game this session.</p>
    </div>
    <div id="scores-content"></div>
  </main>

  <div class="site-footer">© 2026 All rights reserved Hontech Technology.</div>
</div>

<div class="mascot" aria-live="polite">
  <div class="mascot-bee">🐝</div>
  <div class="mascot-bubble" id="mascot-text">Hi! I'm Buzz. Pick a world to explore!</div>
</div>

<script>
(function(){
  "use strict";

  /* ============ shared state ============ */
  var totalStars = 0;
  var muted = false;
  var audioCtx = null;
  var scores = {};
  var currentCategory = null;

  var homeScreen = document.getElementById('home-screen');
  var categoryScreen = document.getElementById('category-screen');
  var gameScreen = document.getElementById('game-screen');
  var scoresScreen = document.getElementById('scores-screen');
  var gamePanel = document.getElementById('game-panel');
  var gameTitleEl = document.getElementById('game-title');
  var roundInfoEl = document.getElementById('round-info');
  var progressRow = document.getElementById('progress-row');
  var stage = document.getElementById('stage');
  var topbarLeft = document.getElementById('topbar-left');
  var totalStarsEl = document.getElementById('total-stars');
  var mascotText = document.getElementById('mascot-text');
  var muteBtn = document.getElementById('mute-btn');

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function pickN(arr, n){ return shuffle(arr).slice(0,n); }
  function pickOne(arr){ return arr[randInt(0,arr.length-1)]; }

  function mascotSay(text){ mascotText.textContent = text; }
  function addTotalStars(n){ totalStars += n; totalStarsEl.textContent = totalStars; }

  function ensureAudio(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; } }
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }
  document.addEventListener('click', ensureAudio, { once:true });

  /* cartoon sound effects */
  function playCartoon(kind){
    if(muted || !audioCtx) return;
    try{
      var now = audioCtx.currentTime;
      if(kind === 'correct'){
        var notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach(function(f, idx){
          var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'triangle'; osc.frequency.value = f;
          var start = now + idx * 0.07;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(start); osc.stop(start + 0.24);
        });
      } else {
        [0, 0.28].forEach(function(offset){
          var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          var start = now + offset;
          osc.frequency.setValueAtTime(300, start);
          osc.frequency.exponentialRampToValueAtTime(140, start + 0.26);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.14, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.28);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(start); osc.stop(start + 0.3);
        });
      }
    }catch(e){ /* ignore audio errors */ }
  }

  function runRoundGame(config){
    enterGameScreen(config.title);
    makeProgressPips();
    var roundIndex = 0;
    var starsEarned = 0;
    var locked = false;

    function nextRound(){
      if(roundIndex >= ROUNDS_PER_GAME){
        showCompletion(config.gameId, starsEarned, config.finishMessage || 'Great job!', function(){
          roundIndex = 0; starsEarned = 0;
          makeProgressPips();
          nextRound();
        });
        return;
      }
      locked = false;
      showRoundInfo(roundIndex);
      stage.innerHTML = '';
      config.buildRound(roundIndex, {
        onAnswer: function(isCorrect, btnEl){
          if(locked) return;
          if(isCorrect){
            locked = true;
            btnEl.classList.add('is-correct');
            markPipDone(roundIndex);
            starsEarned += 1;
            addTotalStars(1);
            playCartoon('correct');
            mascotSay(pickOne(config.praise));
            setTimeout(function(){ roundIndex += 1; nextRound(); }, 850);
          } else {
            btnEl.classList.add('is-wrong');
            playCartoon('wrong');
            mascotSay(pickOne(config.encourage));
            setTimeout(function(){ btnEl.classList.remove('is-wrong'); }, 420);
          }
        }
      });
    }
    nextRound();
  }

  }
  function makeQueue(pool, n){
    var q = [];
    var shuffled = shuffle(pool);
    var guard = 0;
    while(q.length < n && guard < 50){
      for(var i=0;i<shuffled.length && q.length<n;i++){ q.push(shuffled[i]); }
      shuffled = shuffle(pool);
      guard++;
    }
    return q;
  }
  function makeOptions(correctVal, distractors){
    var all = [correctVal].concat(distractors);
    var order = shuffle(all.map(function(_,i){ return i; }));
    var o = order.map(function(i){ return String(all[i]); });
    var c = order.indexOf(0);
    return { o:o, c:c };
  }
  function bankGame(id, title, pool, finishMessage){
    var queue = [];
    runRoundGame({
      gameId:id, title:title, praise:DEFAULT_PRAISE, encourage:DEFAULT_ENCOURAGE, finishMessage:finishMessage,
      buildRound: function(index, api){
        if(index === 0){ queue = makeQueue(pool, ROUNDS_PER_GAME); }
        renderGenericPrompt(queue[index % queue.length], api);
      }
    });
  }
  function proceduralGame(id, title, generatorFn, finishMessage){
    runRoundGame({
      gameId:id, title:title, praise:DEFAULT_PRAISE, encourage:DEFAULT_ENCOURAGE, finishMessage:finishMessage,
      buildRound: function(index, api){ renderGenericPrompt(generatorFn(), api); }
    });
  }

  /* Game 5 — Memory Meadow (custom) */
  var MEMORY_EMOJI = ['🦋','🐞','🐝','🍄','🌸','🐌'];
  function gameMemory(){
    enterGameScreen('Memory Meadow');
    progressRow.innerHTML = '';
    roundInfoEl.textContent = '';
    var deck = shuffle(MEMORY_EMOJI.concat(MEMORY_EMOJI)).map(function(e, idx){ return { id:idx, emoji:e, matched:false }; });
    var flippedIds = [];
    var tries = 0;
    var matchedPairs = 0;
    var locked = false;

    function render(){
      stage.innerHTML = '';
      var meta = document.createElement('div'); meta.className='memory-meta';
      meta.innerHTML = '<span>Pairs found: '+matchedPairs+' / '+MEMORY_EMOJI.length+'</span><span>Tries: '+tries+'</span>';
      stage.appendChild(meta);
      var grid = document.createElement('div'); grid.className='memory-grid';
      deck.forEach(function(card){
        var btn = document.createElement('button');
        btn.className = 'memory-card' + (flippedIds.indexOf(card.id) > -1 || card.matched ? ' flipped' : '') + (card.matched ? ' matched' : '');
        btn.setAttribute('aria-label', card.matched ? 'Matched card' : 'Face-down card');
        btn.innerHTML = '<div class="inner"><div class="face front">?</div><div class="face back">'+card.emoji+'</div></div>';
        btn.addEventListener('click', function(){ handleFlip(card); });
        grid.appendChild(btn);
      });
      stage.appendChild(grid);
    }
    function handleFlip(card){
      if(locked || card.matched || flippedIds.indexOf(card.id) > -1) return;
      flippedIds.push(card.id);
      render();
      if(flippedIds.length === 2){
        tries += 1; locked = true;
        var c1 = deck[flippedIds[0]], c2 = deck[flippedIds[1]];
        if(c1.emoji === c2.emoji){
          setTimeout(function(){
            c1.matched = true; c2.matched = true; matchedPairs += 1; flippedIds = []; locked = false;
            playCartoon('correct');
            mascotSay(pickOne(["Sweet match!","You found a pair!","Great memory!"]));
            render();
            if(matchedPairs === MEMORY_EMOJI.length){
              var starsResult = tries <= 8 ? 8 : (tries <= 12 ? 6 : 4);
              addTotalStars(starsResult);
              setTimeout(function(){ showCompletion('memory', starsResult, 'You matched every pair!', function(){ gameMemory(); }); }, 300);
            }
          }, 500);
        } else {
          playCartoon('wrong');
          mascotSay(pickOne(["Keep those in mind and try again!","Not a match, try another pair!","So close, keep trying!"]));
          setTimeout(function(){ flippedIds = []; locked = false; render(); }, 700);
        }
      }
    }
    mascotSay("Flip two cards to find matching pairs!");
    render();
  }

  function genPattern(){
    var palettes = [ ['🔴','🔵'], ['🟥','🟩','🟦'], ['⭐','🌙'], ['🍎','🍌'], ['🐱','🐶','🐰'] ];
    var palette = palettes[randInt(0,palettes.length-1)];
    var period = palette.length;
    var totalLen = period*2 + randInt(0,1);
    var seq = [];
    for(var i=0;i<totalLen;i++) seq.push(palette[i%period]);
    var next = palette[totalLen%period];
    var extra = ['🟣','🟡','🟠','🍇','🐸','⚽'].filter(function(s){ return palette.indexOf(s) === -1; });
    var distractors = palette.filter(function(s){ return s !== next; }).slice(0,1);
    while(distractors.length < 2){
      var d = extra[randInt(0,extra.length-1)];
      if(distractors.indexOf(d) === -1 && d !== next) distractors.push(d);
    }
    var mo = makeOptions(next, distractors.slice(0,2));
    return { p:'What comes next in the pattern? ' + seq.join(' '), o:mo.o, c:mo.c };
  }

  function genTimesTable(){
    var a = randInt(2,12), b = randInt(2,12), ans = a*b;
    var distractors = [];
    while(distractors.length < 2){
      var d = ans + (randInt(0,1)?1:-1) * randInt(1,10);
      if(d > 0 && d !== ans && distractors.indexOf(d) === -1) distractors.push(d);
    }
    var mo = makeOptions(ans, distractors);
    return { p:'What is ' + a + ' × ' + b + ' ?', o:mo.o, c:mo.c };
  }
  function genFraction(){
    var denomsPool = [2,3,4,5,6,8,10];
    var d1 = pickOne(denomsPool), n1 = randInt(1,d1-1);
    var d2 = pickOne(denomsPool), n2 = randInt(1,d2-1);
    var left = n1/d1, right = n2/d2;
    var options = [n1+'/'+d1+' is bigger', n2+'/'+d2+' is bigger', 'They are equal'];
    var c = Math.abs(left-right) < 0.0001 ? 2 : (left > right ? 0 : 1);
    return { p:'Which is bigger: ' + n1+'/'+d1 + ' or ' + n2+'/'+d2 + '?', o:options, c:c };
  }
  function genPercent(){
    var pcts = [10,20,25,50,75,5];
    var p = pickOne(pcts);
    var base = (p===25||p===75) ? randInt(1,10)*4 : ((p===5||p===10) ? randInt(2,20)*10 : randInt(1,10)*2);
    var ans = Math.round(base*p/100);
    var distractors = [];
    while(distractors.length < 2){
      var d = ans + (randInt(0,1)?1:-1) * randInt(1, Math.max(2, Math.round(ans*0.3)+1));
      if(d >= 0 && d !== ans && distractors.indexOf(d) === -1) distractors.push(d);
    }
    var mo = makeOptions(ans, distractors);
    return { p:'What is ' + p + '% of ' + base + '?', o:mo.o, c:mo.c };
  }
  function genAlgebra(){
    var type = randInt(0,2), x, a, b, ptxt;
    if(type === 0){ x = randInt(1,12); a = randInt(1,15); b = x+a; ptxt = 'x + ' + a + ' = ' + b; }
    else if(type === 1){ x = randInt(1,12); a = randInt(1,15); b = x-a; ptxt = 'x − ' + a + ' = ' + b; }
    else { a = randInt(2,10); x = randInt(1,10); b = a*x; ptxt = a + ' × x = ' + b; }
    var distractors = [];
    while(distractors.length < 2){
      var d = x + (randInt(0,1)?1:-1) * randInt(1,5);
      if(d >= 0 && d !== x && distractors.indexOf(d) === -1) distractors.push(d);
    }
    var mo = makeOptions(x, distractors);
    return { p:'Solve for x: ' + ptxt, o:mo.o, c:mo.c };
  }
  function genGeometry(){
    var l = randInt(2,15), w = randInt(2,15);
    var askArea = Math.random() < 0.5;
    var ans = askArea ? l*w : 2*(l+w);
    var distractors = [askArea ? 2*(l+w) : l*w];
    while(distractors.length < 2){

      if(d > 0 && d !== ans && distractors.indexOf(d) === -1) distractors.push(d);

    var unit = askArea ? ' cm²' : ' cm';
    return { p:'A rectangle is ' + l + ' cm long and ' + w + ' cm wide. What is its ' + (askArea?'area':'perimeter') + '?',
      o: mo.o.map(function(v){ return v + unit; }), c: mo.c };
  }
  function genSequence(){
    var arith = Math.random() < 0.7;
    var seq = [], next, distractors;
    if(arith){
      var start = randInt(1,10), step = randInt(2,7) * (Math.random()<0.2 ? -1 : 1);
      for(var i=0;i<4;i++) seq.push(start+i*step);
      next = start + 4*step;
      distractors = [next+step, next-step];
    } else {
      var s0 = randInt(1,4), ratio = randInt(2,3);
      for(var i2=0;i2<4;i2++) seq.push(s0 * Math.pow(ratio,i2));
      next = s0 * Math.pow(ratio,4);
      distractors = [next+ratio, Math.round(next/ratio)];
    }
    distractors = distractors.filter(function(d, idx, arr){ return d !== next && arr.indexOf(d) === idx; });
    while(distractors.length < 2){
      var d2 = next + randInt(1,5) * (Math.random()<0.5?-1:1);
      if(d2 !== next && d2 >= 0 && distractors.indexOf(d2) === -1) distractors.push(d2);
    }
    var mo = makeOptions(next, distractors.slice(0,2));
    return { p:'What comes next? ' + seq.join(', ') + ', __', o:mo.o, c:mo.c };
  }

    }

    function renderStage(){
      roundInfoEl.textContent = 'Words typed: ' + wordsCorrect;
      stage.innerHTML = '';

      var timerDiv = document.createElement('div');
      timerDiv.className = 'speed-timer' + (timeLeft <= 10 ? ' urgent' : '');
      timerDiv.id = 'speed-timer';
      timerDiv.textContent = '⏱ ' + timeLeft + 's';
      stage.appendChild(timerDiv);

      var prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.innerHTML = 'Type each word as fast as you can!';
      stage.appendChild(prompt);

      var display = document.createElement('div');
      display.className = 'typing-target';
      currentWord.split('').forEach(function(ch){
        var span = document.createElement('span');
        span.className = 'tchar pending';
        span.textContent = ch;
        display.appendChild(span);
      });
      stage.appendChild(display);

      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'typing-input';
      input.autocomplete = 'off';
      input.autocapitalize = 'off';
      input.spellcheck = false;
      stage.appendChild(input);
      input.focus();

      input.addEventListener('input', function(){
        if(finished) return;
        var val = input.value;
        var spans = display.querySelectorAll('.tchar');
        for(var i=0;i<spans.length;i++){
          if(i >= val.length){ spans[i].className = 'tchar pending'; }
          else if(val[i] === currentWord[i]){ spans[i].className = 'tchar correct'; }
          else { spans[i].className = 'tchar wrong'; }
        }
        if(val === currentWord){
          wordsCorrect += 1;
          playCartoon('correct');
          pickWord();
          renderStage();
        }
      });
    }

    function tick(){
      if(gameScreen.classList.contains('hidden')){ clearInterval(timerInterval); return; }
      timeLeft -= 1;
      var timerEl = document.getElementById('speed-timer');
      if(timerEl){
        timerEl.textContent = '⏱ ' + timeLeft + 's';
        if(timeLeft <= 10) timerEl.classList.add('urgent');
      }
      if(timeLeft <= 0){
        clearInterval(timerInterval);
        finishSpeedRound();
      }
    }

    function finishSpeedRound(){
      finished = true;
      var starsEarned = Math.min(8, Math.floor(wordsCorrect / 2));
      addTotalStars(starsEarned);
      showCompletion('speedtyping', starsEarned, "Time's up! You typed " + wordsCorrect + " word" + (wordsCorrect===1?'':'s') + " correctly (~" + wordsCorrect + " WPM).", function(){
        gameSpeedTyping();
      });
    }

    pickWord();
    renderStage();
    timerInterval = setInterval(tick, 1000);
  }
